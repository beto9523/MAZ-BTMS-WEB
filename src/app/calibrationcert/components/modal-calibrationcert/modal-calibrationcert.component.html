<ng-template #content let-modal>
    <div class="modal-header d-flex justify-content-center">
      <h4 class="modal-title" id="user-modal">{{ this.title }}</h4>
    </div>
    <form [formGroup]="form" (ngSubmit)="onFormSubmit()">
      <div class="modal-body">
        <div class="mb-3">
          <div class="row mt-3">
            <!--///////************FORM FIELD: PWO************//////   -->
           
        

            <div class="col-md-4">
                <span
                  class="form-title"
                  [ngClass]="{ required: this.checkRequired('ctrlWO') }"

                  >Work number </span
                >
                
                <p-dropdown  
                [options]="WO" formControlName="ctrlWO"
                placeholder=""
                
                autoWidth="false" [style]="{'width':'100%','height':'40px'}"
                 >
              
                
              </p-dropdown>
        
                        
                <p class="position-relative">
                  <p-message
                    severity="error"
                    *ngIf="
                      form.get('ctrlWO')?.hasError('required') &&
                      form.get('ctrlWO')?.touched
                    "
                    text="Work number  is required"
                  >
                  </p-message>
                </p>


              </div>


             
                <div class="col-md-4">
    
                    <label
                    class="form-title"
                    [ngClass]="{ required: this.checkRequired('ctrlTestMachine') }"

                    > Test machine:</label
                  >
                  <p-dropdown  
                  [options]="machines" formControlName="ctrlTestMachine"
                  placeholder="Select Machine"
                  autoWidth="false" [style]="{'width':'100%','height':'40px'}"
                   >
                
                  
                </p-dropdown>


                  <p class="position-relative">
                    <p-message
                      severity="error"
                      *ngIf="
                        form.get('ctrlTestMachine')?.hasError('required') &&
                        form.get('ctrlTestMachine')?.touched
                      "
                      text="Test machine id  is required"
                    >
                    </p-message>
                  </p>
    
                </div>
                <div class="col-md-4">

                  <span
                  class="form-title"
                  [ngClass]="{ required: this.checkRequired('ctrlLocationUsed') }"
      
                  >Location used </span
                >
                <input
                placeholder="Enter a location"
                type="text"
                formControlName="ctrlLocationUsed"
                class="p-inputtext-sm"
                maxlength="100"
                pInputText
              />
              <p class="position-relative">
                <p-message
                  severity="error"
                  *ngIf="
                    form.get('ctrlLocationUsed')?.hasError('required') &&
                    form.get('ctrlLocationUsed')?.touched
                  "
                  text="Location used    is required"
                >
                </p-message>
              </p>
      
              </div>
              
          </div>
          <div class="row mt-3">
            <div class="col-md-4">

            <span
            class="form-title"
            [ngClass]="{ required: this.checkRequired('ctrlCertDate') }"

            > Certificate date </span
          >
          <p-calendar     dateFormat="yy-mm-dd"
          formControlName="ctrlCertDate"
          >
        
        </p-calendar>

        <p class="position-relative">
          <p-message
          
            severity="error"
            *ngIf="
              form.get('ctrlCertDate')?.hasError('required') &&
              form.get('ctrlCertDate')?.touched
            "
            text="Certificate date  is required"
          >
          </p-message>
        </p>

        </div>

        <div class="col-md-4">

            <span
            class="form-title"
            [ngClass]="{ required: this.checkRequired('ctrlValidFromTo') }"

            >Valid : </span
          >
          <p-calendar   selectionMode="range"  dateFormat="mm/dd/yy"
          formControlName="ctrlValidFromTo"
          ></p-calendar>

          <p class="position-relative">
            <p-message
              severity="error"
              *ngIf="
                form.get('ctrlValidFromTo')?.hasError('required') &&
                form.get('ctrlValidFromTo')?.touched
              "
              text="Valid  date  is required"
            >
            </p-message>
          </p>

          
        </div>

       

        
          </div>

          <div class="row mt-3">

            

          </div>

        
          
   

        
          <div class="row mt-3">

            <div class="col-md-12">

                <span
                class="form-title"
                [ngClass]="{ required: this.checkRequired('ctrlNotes') }"

                >Notes : </span
              >
              <div>
              <input  style="width: 100%;"  pInputTextarea
              formControlName="ctrlNotes"
              />
            </div>

            <p class="position-relative">
              <p-message
                severity="error"
                *ngIf="
                  form.get('ctrlNotes')?.hasError('required') &&
                  form.get('ctrlNotes')?.touched
                "
                text="notes are required"
              >
              </p-message>
            </p>

            </div>

          </div>
          
          <div class="row mt-3" 
          *ngIf="!this.isEdit"
          >

            <div class="col-md-6">

              <span
              class="form-title"
              [ngClass]="{ required: this.checkRequired('files2') }"

              >Upload : </span
            >
            <input type="file" formControlName="files2" (change)="onSelectFile($event)"  accept="application/pdf" />
            <p class="position-relative">
              <p-message
                severity="error"
                *ngIf="
                  form.get('files2')?.hasError('required') &&
                  form.get('files2')?.touched
                "
                text="file is required"
              >
              </p-message>
            </p>
                

            </div>

          </div>


              </div>
        </div>
            <!--///////************FORM FIELD: Serial************//////   -->
            
  
      <div class="modal-footer">
        <button class="btn btn-primary" type="submit"
      
        >
          {{ this.title }}
        </button>
        <button
          ngbAutofocus
          type="button"
          class="btn btn-secondary"
          (click)="onClose()"
        >
          Cancel
        </button>
      </div>
    </form>
  </ng-template>

<ng-template #content let-modal >
    <div class="modal-header d-flex justify-content-center">
      <h4 class="modal-title" id="user-viewCert"> View test certificate  </h4>
    </div>

      <div class="modal-body"  >
        <div class="mb-3">
          <div class="row">
         <iframe style="border:1px solid black" [src]=urlIframe height="500px" width="100%"></iframe>
  
           </div>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-primary" type="submit">
         Ok
        </button>
        
        <button
          ngbAutofocus
          type="button"
          class="btn btn-secondary"
          (click)="modal.close('Save click')"
        >
          Cancel
        </button>
      </div>
  </ng-template>

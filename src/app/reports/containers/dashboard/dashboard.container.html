<div
  class="row wrapper border-bottom white-bg page-heading breadcrumb-div d-flex align-items-center"
>
  <div class="col-lg-10">
    <h2>{{title}}</h2>
    <ol class="breadcrumb">
      <li class="breadcrumb-item">
        <a routerLink="/Login">Home</a>
      </li>
      <li class="breadcrumb-item active">
        <strong>{{title}}</strong>
      </li>
    </ol>
  </div>
</div>

<div class="row mt-2">
  <div class="col-lg-4">
    <div class="ibox float-e-margins">
      <div class="ibox-title">
        <h5>Current Report</h5>
      </div>
      <div class="ibox-content card-ibox">
        <button class="btn btn-primary" (click)="exportChart()">
          Export Chart
        </button>
      </div>
    </div>
  </div>
  <div class="col-lg-4">
    <div class="ibox float-e-margins">
      <div class="ibox-title">
        <h5>Status Chart</h5>
      </div>
      <div class="ibox-content card-ibox"></div>
    </div>
  </div>
  <div class="col-lg-4">
    <div class="ibox float-e-margins">
      <div class="ibox-title">
        <h5>Stats</h5>
      </div>
      <div class="ibox-content card-ibox"></div>
    </div>
  </div>
</div>

<highcharts-chart
  *ngIf="isHighcharts"
  [Highcharts]="Highcharts"
  [options]="chartOptions"
></highcharts-chart>

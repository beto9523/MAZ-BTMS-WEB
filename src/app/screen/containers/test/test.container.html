<div
  class="row wrapper border-bottom white-bg page-heading breadcrumb-div d-flex align-items-center"
>
  <div class="col-lg-10">
    <h2>{{title}}</h2>
    <ol class="breadcrumb">
      <li class="breadcrumb-item">
        <a routerLink="/Login">Home</a>
      </li>
      <li class="breadcrumb-item active">
        <strong>{{title}}</strong>
      </li>
    </ol>
  </div>
</div>
<div class="wrapper wrapper-content animated fadeInRight principalmenu">
  <div class="row">
    <div class="col-lg-12">
      <div class="ibox">
        <div class="ibox-content">
          <div class="row">
            <app-formtest (sendflag)="this.changevalue()" (sendflag)="this.sendValues($event)" [user]="this.user"></app-formtest>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="modal" id="myModal">
  <div class="modal-dialog">
    <div class="modal-content">

      <!-- Modal Header -->
      <div class="modal-header">
        <h4 class="modal-title">Signature</h4>
        
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>

      <!-- Modal body -->
      <div class="modal-body">
        <div class="m-signature-pad--body">
          <canvas #canvas width="450" height="250" style="touch-action: none"> </canvas>
          <div>

      </div>
    </div>      </div>

      <!-- Modal footer -->
      <div class="modal-footer">
        <button type="button" class="button save btn btn-success" data-bs-dismiss="modal" (click)="sweetAlert()"> Save</button>
        <button type="button" class="button clear btn btn-warning" data-action="clear" (click)="onClearClick()"> Clear </button>
        <button type="button" (click)="onClearClick()" class="button clear btn btn-primary" data-bs-dismiss="modal" >Close</button>
      </div>

    </div>
  </div>
</div>
<div class="row" style="padding-left: 10px">
  <div class="col-md-9">
    <div *ngIf="flagforSpinner" class="text-center sendDown ">
      <div class="spinner-border" role="status">
        <span class="sr-only"></span>
      </div>
      <h2>Generating Chart...</h2>
    </div>
    <div *ngIf="flagforChart == true">
      <div class="col-sm-10"
        style="justify-content: right; display: flex">
        Test ID:
        <input
          id="inputsize"
          type="text"
          class="inputcolored"
          value="{{this.testId}}"
          [ngClass]="{ 'p-disabled': true }"
          pInputText
          readonly
        />
          Duration:
        <input
          id="inputsize"
          type="text"
          class="beautify"
          value="{{this.Duration}}"
          [ngClass]="{ 'p-disabled': true }"
          pInputText
          readonly
        />

            Load:
          <input
            id="inputsize"
            type="text"
            class="inputcolorblue beautify"
            value="{{this.minNumber}}"
            [ngClass]="{ 'p-disabled': true }"
            pInputText
            readonly
          />
            Peak:
        
          <input
            type="text"
            class="beautify"
            value="{{this.maxNumber}}"
            id="inputsize"
            [ngClass]="{ 'p-disabled': true }"
            pInputText
            readonly
          />
     
      </div>
      <div id="HCUpdate" style="width: 100%; height: 850px;"> <highcharts-chart
        *ngIf="flagforChart"
        [Highcharts]="Highcharts"
        [options]="chartOptions"
      ></highcharts-chart></div>
     
    </div>
  </div>

  <div class="col-md-2">
    <div
      class="ibox float-e-margins"
      style="padding-right: 10px; align-items: center"
    >
      <div class="ibox-title alignitems divseparatormargintop">
        <h5            
        >PLC STATUS</h5>
      </div>
      <div class="ibox-content card-ibox alignitems green-background">
      <div class="circle"></div><H3> CONNECTED</H3>
      </div>
    </div>

    <div
      class="ibox float-e-margins"
      style="padding-right: 10px"
      *ngIf="flagforTest == true"
    >
      <div class="ibox-title alignitems">
        <h5>TEST RESULT</h5>
      </div>

      <div class="ibox-content card-ibox">
        <div class="justify-content-center alignitems">
          <div class="flex flex-column gap-2 alignitems">
            <div *ngFor="let category of categories" class="field-checkbox">
              <p-checkbox
                [label]="category.name"
                name="group"
                [disabled]="true"
                [(ngModel)]="category.selected"
                [binary]="true" 
                [value]="category"
              ></p-checkbox>
            </div>
            <button  class="btn-primary">OK</button>
          </div>
        </div>
      </div>
      <div class="justify-content-center alignitems divseparatormargintop">
        <button
        class="btn btn-primary col-sm-7"
        type="button" class="btn btn-primary"
        data-bs-toggle="modal"
        [disabled]="disabled"
        data-bs-target="#myModal">
        UPLOAD
      </button>   
    </div>
    
    </div>
    

    <br />
    <br />
  </div>

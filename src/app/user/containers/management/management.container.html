<div class="row wrapper border-bottom white-bg page-heading breadcrumb-div d-flex align-items-center">
  <div class="col-lg-10">
      <h2>{{title}}</h2>
      <ol class="breadcrumb">
          <li class="breadcrumb-item">
              <a routerLink="/Login">Home</a>
          </li>
          <li class="breadcrumb-item active">
              <strong>{{title}}</strong>
          </li>
      </ol>
  </div>
  <div class="col-lg-2">
      <div class="title-action">
          <button (click)="addUser()" type="button" class="btn btn-primary btn-block">
              <span>Add User</span>
          </button>
      </div>
  </div>
</div>


<div class="wrapper wrapper-content animated fadeInRight principalmenu">
  <div class="row">
      <div class="col-lg-12">
          <div class="ibox">
              <div class="ibox-content">
                  <div class="row">
                  </div>
                  <app-table-users></app-table-users>
              </div>
          </div>
      </div>
  </div>
</div>

<app-modal-user (reloadTable)="reloadTable()" [isEdit]="false"></app-modal-user>

<div class="row border-bottom">
    <nav class="navbar navbar-static-top nav-bg" role="navigation" style="margin-bottom: 0">
        <div class="navbar-header">
            <a class="minimalize-styl-2 btn btn-primary " (click)="toggleNavigation()"><i class="fa fa-bars"></i> </a>

        </div>
        <ul class="nav navbar-top-links navbar-right">
          <li class="li-nav me-3"  *ngIf="this.loggedIn">
            <i  class="fa fa-user me-1"></i>
            <span class="">
             {{this.user}}
            </span>

          </li>

            <li (click)="logOut()" *ngIf="this.loggedIn">
                <a href="/Login">
                    <i  class="fa fa-sign-out"></i> Log out
                </a>
            </li>

        </ul>

    </nav>
</div>

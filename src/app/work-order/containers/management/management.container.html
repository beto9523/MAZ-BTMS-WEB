<div class="row wrapper border-bottom white-bg page-heading breadcrumb-div d-flex align-items-center">

    <div class="col-lg-10">
        <h2>{{title}}</h2>
        <ol class="breadcrumb">
            <li class="breadcrumb-item">
                <a routerLink="/Login">Home</a>
            </li>
            <li class="breadcrumb-item active">
                <strong>{{title}}</strong>
            </li>
        </ol>
    </div>

    <div class="col-lg-2">
        <div class="title-action">
            <button (click)="addWO()" type="button" class="btn btn-primary btn-block">
                <span>Add PWO</span>
            </button>
        </div>
    </div>
</div>

<div class="wrapper wrapper-content animated fadeInRight principalmenu">
    <div class="row">
        <div class="col-lg-12">
            <div class="ibox">
                <div class="ibox-content">
                    <div class="row">
                    </div>
                    <app-table-orders></app-table-orders>
                </div>
            </div>
        </div>
    </div>
</div>

<app-modal-orders (reloadTable)="reloadTable()" [isEdit]="false"></app-modal-orders>
